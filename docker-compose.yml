services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: fleet-pulse-db
    environment:
      POSTGRES_DB: fleet_pulse_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fleet_pulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: