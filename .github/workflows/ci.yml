name: Fleet-Pulse CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: gradle
      - name: Build and Test with Gradle
        run: ./gradlew build
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/fleet-client
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/fleet-client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test -- --run